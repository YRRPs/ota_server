worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    max_ranges 1;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /srv/ota;
        autoindex off;

        location = /healthz {
            limit_except GET { deny all; }
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /updates/salami.json {
            limit_except GET { deny all; }
            default_type application/json;
            add_header Cache-Control "no-cache" always;
            try_files /updates/salami.json =404;
        }

        # Updater URI .../updates/{device}/{incr}.json. The fallback is internal
        # because the LineageOS Updater refuses redirects.
        location ~ "^/updates/salami/[0-9]+\.json$" {
            limit_except GET { deny all; }
            default_type application/json;
            add_header Cache-Control "no-cache" always;
            try_files $uri /updates/salami.json;
        }

        location = /updates/salami/gapps.json {
            limit_except GET { deny all; }
            default_type application/json;
            add_header Cache-Control "no-cache" always;
            try_files /updates/salami/gapps.json =404;
        }

        # Gapps channel: .../updates/{device}/gapps/{incr}.json, internal fallback to its full entry.
        location ~ "^/updates/salami/gapps/[0-9]+\.json$" {
            limit_except GET { deny all; }
            default_type application/json;
            add_header Cache-Control "no-cache" always;
            try_files $uri /updates/salami/gapps.json;
        }

        location /updates/ {
            return 404;
        }

        location = /install/salami/ {
            limit_except GET { deny all; }
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            add_header Cache-Control "no-cache" always;
        }

        # The vanilla regex needs 8 digits directly after salami/, so it cannot overlap the gapps regex below.
        location ~ "^/install/salami/[0-9]{8}-[0-9]{6}/" {
            limit_except GET { deny all; }
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location = /install/salami/gapps/ {
            limit_except GET { deny all; }
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            add_header Cache-Control "no-cache" always;
        }

        location ~ "^/install/salami/gapps/[0-9]{8}-[0-9]{6}/" {
            limit_except GET { deny all; }
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            return 404;
        }
    }
}
